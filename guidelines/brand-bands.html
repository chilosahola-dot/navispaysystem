<!-- @dsCard group="Brand" viewport="700x220" subtitle="Alternating light/dark bands, the system's one structural rule" name="Two bands" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:220px;font-family:var(--nv-font)">
  <div style="flex:1;background:var(--nv-bg);color:var(--nv-navy);display:flex;flex-direction:column;justify-content:center;padding:20px;gap:8px;border-right:1px solid var(--nv-border)">
    <div style="font-family:var(--nv-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--nv-muted)">Light band</div>
    <button class="btn btn-cta" style="width:max-content">Send payment</button>
  </div>
  <div class="band-dark" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px;gap:8px">
    <div style="font-family:var(--nv-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--nv-dark-muted)">Dark band</div>
    <button class="btn btn-accent" style="width:max-content">Send payment</button>
  </div>
</div>
